<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create New Election</title>
    <link rel="stylesheet" href="../styles/new_election.css">
</head>
<body>
    <header>
        <h1>Create a New Election</h1>
    </header>
    <main>
        <form id="newElectionForm">
            <!-- Election Title -->
            <label for="election-title">Election Title:</label>
            <input type="text" id="election-title" name="title" required>
            
            <!-- Election Description -->
            <label for="election-description">Description:</label>
            <textarea id="election-description" name="description" required></textarea>
            
            <!-- Start Date -->
            <label for="election-start-date">Start Date:</label>
            <input type="date" id="election-start-date" name="start_date" required>
            
            <!-- End Date -->
            <label for="election-end-date">End Date:</label>
            <input type="date" id="election-end-date" name="end_date" required>
            
            <!-- Candidates Section -->
            <h3>Candidates</h3>
            <div id="candidatesContainer">
                <!-- Candidate fields will be dynamically added here -->
            </div>
            <button type="button" id="addCandidateBtn">Add Candidate</button>
            
            <!-- Submit Button -->
            <button type="submit" class="btn primary">Create Election</button>
        </form>

        <!-- Active Elections Section -->
        <section id="electionsContainer">
            <!-- Active elections will be dynamically displayed here -->
        </section>
    </main>
    <footer>
        <p>Created by [Your Name] | &copy; 2024 VoteEase</p>
    </footer>
    <script src="../scripts/new_election.js"></script>
</body>
</html>
