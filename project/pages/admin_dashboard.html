<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard - VoteEase</title>
    <link rel="stylesheet" href="../styles/admin_dashboard.css">
</head>
<body>
    <nav class="navbar">
        <div class="logo">VoteEase Admin</div>
        <div class="admin-info">
            <span id="adminName">Welcome, Admin</span>
            <button id="logoutBtn" class="action-btn" data-logout>Logout</button>
        </div>
    </nav>

    <main class="admin-dashboard">
        <section class="quick-actions">
            <button id="createElection" class="action-btn">Create New Election</button>
        </section>

        <section class="elections-overview">    
            <h2>Active Elections</h2>
            <div id="activeElections" class="elections-grid">
                <!-- Active elections will be dynamically added here -->
            </div>
        </section>
    </main>

    <footer>
        <p>Created by [Your Name] | &copy; 2024 VoteEase</p>
    </footer>

    <script src="../scripts/admin_dashboard.js"></script>
</body>
</html>
