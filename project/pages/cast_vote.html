<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cast Vote - VoteEase</title>
    <link rel="stylesheet" href="../styles/cast_vote.css">
</head>
<body>
    <nav class="navbar">
        <div class="logo">VoteEase Voter</div>
        <div class="voter-info">
            <span id="voterName">Welcome, Voter</span>
            <button id="logoutBtn">Logout</button>
        </div>
    </nav>

    <main class="cast-vote">
        <section class="election-details">
            <h2 id="electionTitle">Election Title</h2>
            <p id="electionDescription">Election Description</p>
        </section>

        <section class="candidates-list">
            <h3>Candidates</h3>
            <ul id="candidates">
                <!-- Candidates will be dynamically added here -->
            </ul>
        </section>
    </main>

    <footer>
        <p>Created by [Your Name] | &copy; 2024 VoteEase</p>
    </footer>

    <script src="../scripts/cast_vote.js"></script>
</body>
</html>
