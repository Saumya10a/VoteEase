<!DOCTYPE html>
<html lang="en">
<head>

  <title>Manage Voters</title>
  <link rel="stylesheet" href="../styles/manage_voters.css">
</head>
<body>
  <div class="container">
    <header>
      <h1>Manage Voters</h1>

    <!-- Voter Data Table -->

      </table>
    </section>
  </div>

  <script src="../scripts/manage_voters.js"></script>
