<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Login - VoteEase</title>
    <link rel="stylesheet" href="../styles/auth.css">
</head>
<body>
    <nav class="navbar">
        <div class="logo">VoteEase</div>
        <div class="nav-links">
            <a href="../index.html">Home</a>
        </div>
    </nav>

    <main class="auth-container">
        <div class="auth-card">
            <h1>Admin Login</h1>
            <form id="loginForm" class="auth-form">
                <div class="form-group">
                    <label for="username">Username</label>
                    <input type="text" id="username" name="username" required>
                </div>
                <div class="form-group">
                    <label for="password">Password</label>
                    <input type="password" id="password" name="password" required>
                </div>
                <button type="submit" class="auth-btn">Login</button>
            </form>
        </div>
    </main>

    <footer>
        <!-- Add your details here -->
        <p>Created by [Your Name] | &copy; 2024 VoteEase</p>
    </footer>

    <body>
    <!-- Bubble and Line Elements -->
    <div class="bubble" style="width: 40px; height: 40px; top: 100vh; left: 30%; animation-duration: 12s;"></div>
    <div class="bubble" style="width: 50px; height: 50px; top: 100vh; left: 60%; animation-duration: 14s;"></div>
    <div class="bubble" style="width: 60px; height: 60px; top: 100vh; left: 80%; animation-duration: 18s;"></div>

    <div class="line" style="animation-duration: 10s;"></div>

    <!-- Existing Content -->
    <div class="navbar">
        <!-- Navbar content -->
    </div>

    <div class="auth-container">
        <div class="auth-card">
            <!-- Auth Card Content -->
        </div>
    </div>

    <footer>
        <!-- Footer content -->
    </footer>
</body>


    <script src="../scripts/admin_login.js"></script>
</body>
</html>
